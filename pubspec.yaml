name: bechi_player_prototype
description: "Player nativo Bechi Flix com controles Flutter e codecs locais."
publish_to: 'none'
version: 0.2.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/native-aac.mp4
    - assets/fixtures/native-ac3.mkv
    - assets/fixtures/native-hevc-eac3.mkv
    - assets/fixtures/native-xvid-mp3.avi
    - assets/fixtures/native-vp9-opus.webm
    - assets/fixtures/native-h264-pcm.mov
    - assets/fixtures/native-h264-aac.ts
    - assets/fixtures/native-flv1-mp3.flv
    - assets/fixtures/native-wmv2-wma.wmv
    - assets/fixtures/native-mpeg2-mp2.mpg
    - assets/fixtures/native-h264-dts.mkv
    - assets/certificates/cacert.pem
    - assets/hosted_source.js
    - assets/build_info.json
    - THIRD_PARTY_NOTICES.txt
