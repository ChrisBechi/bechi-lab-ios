name: Build iPhone prototype
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish the verified native IPA
      providers:
        type: boolean
        default: false
        description: Test real providers with a temporary QA session
permissions:
  contents: write
concurrency:
  group: ios-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install official Flutter SDK with verified checksum
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, zipfile
          root='https://storage.googleapis.com/flutter_infra_release/releases/'
          with urllib.request.urlopen(root+'releases_macos.json',timeout=30) as response:
              releases=json.load(response)['releases']
          arch='arm64' if os.uname().machine=='arm64' else 'x64'
          release=next(r for r in releases if r['version']=='3.44.2' and r['channel']=='stable' and r.get('dart_sdk_arch','x64')==arch)
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'flutter.zip'
          urllib.request.urlretrieve(root+release['archive'],path)
          digest=hashlib.sha256()
          with path.open('rb') as stream:
              for block in iter(lambda:stream.read(1024*1024),b''):digest.update(block)
          assert digest.hexdigest()==release['sha256']
          # ditto retains the SDK executable permissions.
          import subprocess
          subprocess.run(['ditto','-x','-k',str(path),os.environ['RUNNER_TEMP']],check=True)
          with open(os.environ['GITHUB_PATH'],'a') as output:output.write(os.environ['RUNNER_TEMP']+'/flutter/bin\n')
          PY
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - name: Record source provenance
        run: python3 -c 'import json,os,pathlib; pathlib.Path("assets/build_info.json").write_text(json.dumps({"version":"0.2.0","commit":os.environ["GITHUB_SHA"],"run":os.environ["GITHUB_RUN_ID"]}))'
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: node --test test/hosted_source.test.mjs
      - name: Start an available iPhone simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,rows in d["devices"].items() if "iOS" in k for v in rows if v["isAvailable"] and "iPhone" in v["name"]))')
          echo "BECHI_SIMULATOR=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Test real native decoding and Flutter controls on iPhone
        timeout-minutes: 17
        run: python3 ci/native_test.py
      - name: Test real providers separately
        if: inputs.providers
        continue-on-error: true
        timeout-minutes: 68
        env:
          BECHI_QA_TOKEN: ${{ secrets.BECHI_NATIVE_QA_SESSION }}
        run: python3 ci/native_test.py --providers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-test-diagnostics
          path: native-diagnostics/
      - name: Build device release without an Apple signing identity
        run: flutter build ios --release --no-codesign
      - name: Package IPA for SideStore re-signing
        run: |
          mkdir -p dist/Payload
          ditto build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Payload Bechi-Native-0.2.0.ipa
          shasum -a 256 Bechi-Native-0.2.0.ipa > SHA256.txt
          test -f Payload/Runner.app/Frameworks/Flutter.framework/Flutter
          test -f Payload/Runner.app/Frameworks/Mpv.framework/Mpv
          test ! -e Payload/Runner.app/Frameworks/flutter_inappwebview_ios.framework
          test ! -e Payload/Runner.app/Frameworks/App.framework/flutter_assets/assets/source_lab.js
          file Payload/Runner.app/Runner
      - uses: actions/upload-artifact@v4
        with:
          name: Bechi-Native-0.2.0
          path: |
            dist/Bechi-Native-0.2.0.ipa
            dist/SHA256.txt
      - name: Publish test download
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "native-${GITHUB_RUN_NUMBER}" dist/Bechi-Native-0.2.0.ipa dist/SHA256.txt --prerelease --title 'Bechi Native 0.2.0 · iPhone' --notes-file RELEASE_NOTES.md
