name: Build Android codec diagnostic
on:
  workflow_dispatch:
    inputs:
      source_lab:
        type: boolean
        default: false
        description: Build the standalone ARM64 source player for physical testing
      emulator:
        type: boolean
        default: false
        description: Exercise the native decoder and controls in an Android emulator
      artifact_run:
        type: string
        default: ''
        description: Optional existing build run for emulator-only diagnostics
permissions:
  contents: read
  actions: read
concurrency:
  group: android-codec-diagnostic
  cancel-in-progress: true
jobs:
  android:
    if: inputs.artifact_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BECHI_ANDROID_TARGETS: ${{ inputs.emulator && 'android-arm64,android-x64' || 'android-arm64' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified Flutter SDK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.request
          root='https://storage.googleapis.com/flutter_infra_release/releases/'
          with urllib.request.urlopen(root+'releases_linux.json',timeout=30) as response: releases=json.load(response)['releases']
          release=next(r for r in releases if r['version']=='3.44.2' and r['channel']=='stable' and r.get('dart_sdk_arch','x64')=='x64')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'flutter.tar.xz'
          urllib.request.urlretrieve(root+release['archive'],path)
          digest=hashlib.sha256()
          with path.open('rb') as stream:
              for block in iter(lambda:stream.read(1024*1024),b''):digest.update(block)
          assert digest.hexdigest()==release['sha256']
          subprocess.run(['tar','-xJf',str(path),'-C',os.environ['RUNNER_TEMP']],check=True)
          with open(os.environ['GITHUB_PATH'],'a') as output:output.write(os.environ['RUNNER_TEMP']+'/flutter/bin\n')
          PY
      - name: Record source provenance
        run: python3 -c 'import json,os,pathlib; pathlib.Path("assets/build_info.json").write_text(json.dumps({"version":"0.2.0","commit":os.environ["GITHUB_SHA"],"run":os.environ["GITHUB_RUN_ID"]}))'
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: node --test test/hosted_source.test.mjs test/android_hosted_bridge.test.mjs
      - name: Build the ARM64 source player
        if: inputs.source_lab
        env:
          BECHI_SOURCE_LAB: '1'
        run: |
          flutter build apk --release --target lib/main.dart --target-platform android-arm64 --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Bechi-Native-Android-0.2.0.apk
          cd dist
          sha256sum Bechi-Native-Android-0.2.0.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        if: inputs.source_lab
        with:
          name: Bechi-Native-Android
          path: |
            dist/Bechi-Native-Android-0.2.0.apk
            dist/SHA256.txt
      - if: ${{ !inputs.source_lab }}
        run: flutter build apk --debug --target lib/codec_debug.dart --target-platform "$BECHI_ANDROID_TARGETS"
      - name: Package diagnostic
        if: ${{ !inputs.source_lab }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/Bechi-Codecs-0.2.0.apk
      - name: Build automatic physical-device codec checks
        if: ${{ !inputs.source_lab }}
        env:
          BECHI_CODEC_TESTS: '1'
        run: |
          flutter build apk --debug --target integration_test/native_player_test.dart --target-platform "$BECHI_ANDROID_TARGETS"
          cp build/app/outputs/flutter-apk/app-debug.apk dist/Bechi-Codec-Checks-0.2.0.apk
          cd dist
          sha256sum Bechi-Codecs-0.2.0.apk Bechi-Codec-Checks-0.2.0.apk > SHA256-Android.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.source_lab }}
        with:
          name: Bechi-Android-Codecs
          path: |
            dist/Bechi-Codecs-0.2.0.apk
            dist/Bechi-Codec-Checks-0.2.0.apk
            dist/SHA256-Android.txt
  emulator:
    if: ${{ always() && inputs.emulator && !inputs.source_lab && (needs.android.result == 'success' || (needs.android.result == 'skipped' && inputs.artifact_run != '')) }}
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Bechi-Android-Codecs
          path: dist
          run-id: ${{ inputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the APKs from this build
        working-directory: dist
        run: sha256sum --check SHA256-Android.txt
      - name: Prepare an isolated official Android image
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/bechi-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name bechi-native --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
          sudo chmod a+rw /dev/kvm
      - name: Exercise all eleven codecs and native controls
        run: python3 ci/android_native_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-diagnostics
          path: android-diagnostics/
